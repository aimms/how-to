stages:
  - test
  - deploy

.run_on_dockerhost: &run_on_dockerhost
  tags:
    - docker20
  image: "${DOCKER_ACCESS_URL}/other/dockerdev/documentation:latest"
  before_script:
    # The runner checks out the repo as a different user than the image runs as,
    # so Git refuses to trust it ("detected dubious ownership"). This makes Sphinx
    # unable to read per-page "last updated" dates. Trust the checkout directory.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

linkcheck:
  <<: *run_on_dockerhost
  stage: test
  script:
    - python3 -msphinx -W --keep-going -b linkcheck . _build/linkcheck
  allow_failure: true

spellcheck:
  <<: *run_on_dockerhost
  stage: test
  script:
    - python3 -msphinx -W --keep-going -b spelling . _build/spelling

build:
  <<: *run_on_dockerhost
  stage: test
  script:
    - sphinx-build -W --keep-going -b html . _build/html

# Every branch gets its own parallel Pages deployment at:
#   <CI_PAGES_URL>/<branch-slug>/
build_and_staging:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"
      when: on_success
    - when: never
  # The "pages" keyword - not the job name - is what makes this a Pages job
  # (GitLab 17.9+). Keep it, or staging stops publishing.
  pages:
    path_prefix: "$CI_COMMIT_REF_SLUG"
    # Articles can take months. Every push to the branch republishes and resets
    # this clock, so only branches that go quiet for a full quarter expire - and
    # re-running this job republishes them at the same URL.
    expire_in: 3 months
  environment:
    name: docs-staging/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL
  script:
    - sphinx-build -M html . _build
    # Pages publishes the "public" directory at the repository root
    - rm -rf public
    - mv _build/html public
    - echo "Staging documentation published to ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public

build_and_deploy:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - sphinx-build -b html . _build/html
    - bash load_ssh_key_for_deploy.sh
    - ssh support@data.aimms.com rm -f -r /home/aimms/www/how-to.aimms.com/staging/
    - rsync -rt _build/html/ support@data.aimms.com:/home/aimms/www/how-to.aimms.com

az_deploy:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - sphinx-build -b html . _build/html
    - az storage copy -s '_build/html' --recursive --destination-container '$web' -- --overwrite=true --as-subdir=false
    - bash load_ssh_key_for_deploy.sh
    # - ssh support@data.aimms.com rm -f -r /home/aimms/www/how-to-staging/staging/

upload_html_to_rfx_blob:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - sphinx-build -b html . _build/html
    - mkdir -p _build/flat
    - |
      set -eo pipefail
      find _build/html -name "*.html" -print0 | while IFS= read -r -d '' f; do
        parent=$(basename "$(dirname "$f")")
        filename=$(basename "$f")
        if [ "$parent" = "html" ]; then
          cp "$f" "_build/flat/$filename"
        else
          cp "$f" "_build/flat/${parent}-${filename}"
        fi
      done
    - >
      az storage blob sync
      --connection-string "$RALFXPROJECT_CONNECTION_STRING"
      --container rfx-aimms-howto
      --source _build/flat
      --delete-destination true
