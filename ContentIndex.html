<!DOCTYPE html>
<!--
  Redirect stub for the former homepage filename.

  The site homepage used to be built from ContentIndex.rst, so it was published
  as /ContentIndex.html. That source file was renamed to index.rst, which is what
  conf.py's master_doc has always pointed at. External links, bookmarks and search
  results still reference the old filename, so this file keeps them working.

  It is not generated by Sphinx - it is copied verbatim via html_extra_path in
  conf.py, which means it lands in every delivery target (rsync to
  how-to.aimms.com, Azure $web, the RFX blob and the GitLab Pages staging site)
  without any per-server configuration.

  The canonical link is absolute so search engines consolidate ranking signals
  onto the production homepage. The refresh target is relative, and names
  index.html explicitly, so the redirect resolves correctly on every host
  regardless of how that host is configured to serve a directory root.

  Once a real 301 redirect exists on the web server this file becomes redundant,
  but harmless - a 301 takes effect before the request ever reaches it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to the AIMMS How-To homepage</title>
  <link rel="canonical" href="https://how-to.aimms.com/">
  <meta http-equiv="refresh" content="0; url=index.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 4rem auto;
      max-width: 34rem;
      padding: 0 1.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>This page has moved</h1>
  <p>
    The AIMMS How-To homepage is now at
    <a href="index.html">how-to.aimms.com</a>.
  </p>
  <p>You should be redirected automatically. If not, follow the link above.</p>
</body>
</html>
