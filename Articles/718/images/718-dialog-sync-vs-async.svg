<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Raleway, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">A dialog call in WinUI and in WebUI</title>
  <desc id="d">In WinUI, DialogAsk waits for the user, and the code after the dialog follows in the same procedure, with the same local variables. In WebUI, RequestPerformWebUIDialog returns at once and the procedure ends. When the user selects an action, AIMMS calls the ondone procedure, which holds the code after the dialog. The variable p_count, used before and after the dialog, is global.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0B0B0C" fill-opacity="0.7"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0B0B0C; }
      .sub   { font-size: 15px; font-weight: 400; fill: #0B0B0C; }
      .proc  { font-family: Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 600; fill: #0B0B0C; }
      .head  { font-size: 17px; font-weight: 600; fill: #0B0B0C; }
      .code  { font-family: Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 400; fill: #0B0B0C; }
      .note  { font-size: 14px; font-weight: 400; fill: #0B0B0C; }
      .white { fill: #FFFFFF; }
      .flow  { stroke: #0B0B0C; stroke-opacity: 0.55; stroke-width: 1.25; fill: none; stroke-linecap: round; }
      .dash  { stroke-dasharray: 2 5; }
    </style>
  </defs>

  <!-- ===================== WinUI ===================== -->
  <rect x="20" y="20" width="480" height="600" rx="24" fill="#F4EFEA"/>
  <text x="44" y="62" class="title">WinUI: the dialog waits</text>
  <text x="44" y="88" class="sub">DialogAsk stops the procedure until the user answers.</text>

  <rect x="44" y="112" width="432" height="440" rx="18" fill="#FFFFFF"/>
  <text x="64" y="144" class="proc">pr_deleteSelectedPlantsWinUI</text>

  <rect x="64" y="164" width="392" height="84" rx="14" fill="#E6DCD3"/>
  <text x="84" y="198" class="head">Code before the dialog</text>
  <text x="84" y="224" class="code">p_count := Count( ... ) ;</text>

  <line x1="260" y1="250" x2="260" y2="288" class="flow" marker-end="url(#arr)"/>

  <rect x="64" y="292" width="392" height="84" rx="14" fill="#BCEC48"/>
  <text x="84" y="326" class="code" font-weight="600" font-size="15">DialogAsk( ... )</text>
  <text x="84" y="352" class="note">execution waits here</text>

  <line x1="260" y1="378" x2="260" y2="444" class="flow" marker-end="url(#arr)"/>
  <text x="276" y="416" class="note">the user presses a button</text>

  <rect x="64" y="448" width="392" height="84" rx="14" fill="#E6DCD3"/>
  <text x="84" y="482" class="head">Code after the dialog</text>
  <text x="84" y="508" class="note">uses the answer and the local p_count</text>

  <text x="44" y="588" class="sub">One procedure: the locals stay available.</text>

  <!-- ===================== WebUI ===================== -->
  <rect x="540" y="20" width="640" height="600" rx="24" fill="#F4EFEA"/>
  <text x="564" y="62" class="title">WebUI: the dialog call returns at once</text>
  <text x="564" y="88" class="sub">The code after the dialog moves to an ondone procedure.</text>

  <!-- procedure that opens the dialog -->
  <rect x="564" y="112" width="380" height="286" rx="18" fill="#FFFFFF"/>
  <text x="584" y="144" class="proc">pr_deleteSelectedPlantsWebUI</text>

  <rect x="584" y="164" width="340" height="84" rx="14" fill="#E6DCD3"/>
  <text x="604" y="198" class="head">Code before the dialog</text>
  <text x="604" y="224" class="code">p_count := Count( ... ) ;</text>

  <line x1="754" y1="250" x2="754" y2="282" class="flow" marker-end="url(#arr)"/>

  <rect x="584" y="286" width="340" height="76" rx="14" fill="#BCEC48"/>
  <text x="604" y="318" class="code" font-weight="600">RequestPerformWebUIDialog( ... )</text>
  <text x="604" y="344" class="note">returns at once</text>

  <text x="584" y="384" class="note">The procedure ends. The dialog stays open.</text>

  <!-- the user chooses -->
  <line x1="754" y1="400" x2="754" y2="466" class="flow" marker-end="url(#arr)"/>
  <text x="770" y="421" class="note">the user selects an action,</text>
  <text x="770" y="439" class="note">AIMMS calls the ondone</text>
  <text x="770" y="457" class="note">procedure</text>

  <!-- ondone procedure -->
  <rect x="564" y="470" width="380" height="132" rx="18" fill="#FFFFFF"/>
  <text x="584" y="502" class="proc">pr_deleteSelectedPlantsDone( sp_action )</text>
  <rect x="584" y="516" width="340" height="70" rx="14" fill="#E6DCD3"/>
  <text x="604" y="546" class="head">Code after the dialog</text>
  <text x="604" y="570" class="note">uses sp_action and p_count</text>

  <!-- global -->
  <rect x="968" y="112" width="188" height="490" rx="18" fill="#0B0B0C"/>
  <text x="988" y="150" class="head white">Global</text>
  <text x="988" y="178" class="code white" font-weight="600">p_count</text>
  <text x="988" y="222" class="note white">Declared in the</text>
  <text x="988" y="242" class="note white">model, so both</text>
  <text x="988" y="262" class="note white">procedures can</text>
  <text x="988" y="282" class="note white">use it.</text>
  <text x="988" y="330" class="note white">Written before</text>
  <text x="988" y="350" class="note white">the dialog, read</text>
  <text x="988" y="370" class="note white">after it.</text>

  <line x1="926" y1="206" x2="962" y2="206" class="flow dash" marker-end="url(#arr)"/>
  <line x1="966" y1="551" x2="928" y2="551" class="flow dash" marker-end="url(#arr)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
